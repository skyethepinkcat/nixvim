name: check

on:
  pull_request:
  push:

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: "https://nix-cache.skyenet.online"
          cache: "skyenet"
          token: ${{ secrets.ATTIC_AUTH_TOKEN }}

      - name: Check nixfmt
        run: nix run nixpkgs#nixfmt -- --check $(find . -name "*.nix" -not -path "./.git/*")

      - name: Check statix
        run: nix run nixpkgs#statix -- check .
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}


    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: "https://nix-cache.skyenet.online"
          cache: "skyenet"
          token: ${{ secrets.ATTIC_AUTH_TOKEN }}

      - name: Build
        run: nix build .
  claude:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback, but only if neccessary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  check-changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for CHANGELOG.md changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.actor != 'dependabot[bot]' }}
        run: |
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md was not updated. Add the 'skip-changelog' label to bypass."
            exit 1
          fi
